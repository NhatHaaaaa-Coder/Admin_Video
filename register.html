<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — VideoHub Admin</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Loading State -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p style="font-weight: 500; color: var(--text-secondary);">Initializing Client-Side SQLite...</p>
  </div>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <div class="auth-header">
        <div class="auth-brand">
          <div class="brand-icon">
            <i class="fa-solid fa-play"></i>
          </div>
          <span>VideoHub</span>
        </div>
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Register a demo administrator profile in SQLite</p>
      </div>

      <div class="auth-card">
        
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name" class="form-label">Full name <span class="required">*</span></label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Johnson" required autocomplete="name">
            <div class="form-error" id="name-error">Please enter your full name</div>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email address <span class="required">*</span></label>
            <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required autocomplete="email">
            <div class="form-error" id="email-error">Please provide a valid email address</div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-password" class="form-label">Password <span class="required">*</span></label>
              <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" required autocomplete="new-password">
              <div class="form-error" id="password-error">Minimum 6 characters</div>
            </div>

            <div class="form-group">
              <label for="reg-confirm-password" class="form-label">Confirm password <span class="required">*</span></label>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
              <div class="form-error" id="confirm-error">Passwords must match</div>
            </div>
          </div>

          <div class="form-group" style="margin-top: 6px;">
            <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 0.825rem; color: var(--text-secondary); cursor: pointer;">
              <input type="checkbox" id="reg-agree" required style="accent-color: var(--primary); margin-top: 3px; cursor: pointer;">
              <span>I acknowledge this is a client-side demo account stored inside the browser's SQLite database.</span>
            </label>
            <div class="form-error" id="agree-error" style="margin-top: 4px;">You must check the agreement box</div>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="btn-submit-register" style="margin-top: 16px;">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <!-- sql.js WASM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  <!-- Application Scripts -->
  <script src="assets/js/database.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loadingOverlay = document.getElementById('loading-overlay');
      
      try {
        if (window.supabaseService) {
          await window.supabaseService.checkConnection();
        }
        await window.dbService.init();
      } catch (err) {
        console.error('Database load failed:', err);
      } finally {
        if (loadingOverlay) loadingOverlay.classList.add('hidden');
      }

      window.authService.guardRoute(false);

      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nameInput = document.getElementById('reg-name');
        const emailInput = document.getElementById('reg-email');
        const passInput = document.getElementById('reg-password');
        const confirmInput = document.getElementById('reg-confirm-password');
        const agreeCheck = document.getElementById('reg-agree');

        let valid = true;

        if (!nameInput.value.trim()) {
          nameInput.classList.add('is-invalid');
          valid = false;
        } else {
          nameInput.classList.remove('is-invalid');
        }

        const emailVal = emailInput.value.trim();
        if (!emailVal || !emailVal.includes('@')) {
          emailInput.classList.add('is-invalid');
          valid = false;
        } else {
          emailInput.classList.remove('is-invalid');
        }

        const passVal = passInput.value.trim();
        if (passVal.length < 6) {
          passInput.classList.add('is-invalid');
          valid = false;
        } else {
          passInput.classList.remove('is-invalid');
        }

        if (confirmInput.value.trim() !== passVal) {
          confirmInput.classList.add('is-invalid');
          valid = false;
        } else {
          confirmInput.classList.remove('is-invalid');
        }

        if (!agreeCheck.checked) {
          document.getElementById('agree-error').style.display = 'block';
          valid = false;
        } else {
          document.getElementById('agree-error').style.display = 'none';
        }

        if (!valid) return;

        try {
          await window.authService.register(nameInput.value.trim(), emailVal, passVal);
          showToast('success', 'Registration Complete', 'Account created in users.db! Please log in.');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1200);
        } catch (err) {
          showToast('error', 'Registration Error', err.message);
        }
      });
    });
  </script>
</body>
</html>
